[package]
name = "web"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
leptos.workspace = true
leptos_meta.workspace = true
leptos_router.workspace = true
leptos_axum = { workspace = true, optional = true }

domain = { path = "../domain" }
widgets = { path = "../widgets" }
ui = { path = "../ui" }
storefront = { path = "../storefront" }
editor = { path = "../editor" }
db = { path = "../db", optional = true }
media = { path = "../media", optional = true }
axum = { workspace = true, optional = true, features = ["multipart"] }
tokio = { workspace = true, optional = true }
uuid = { workspace = true, optional = true }
reqwest = { version = "0.13", optional = true }
rand = { workspace = true, optional = true }
hex = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
dotenvy = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
web-sys = { workspace = true }
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }
js-sys = "0.3"

http.workspace = true
cfg-if.workspace = true
thiserror.workspace = true

[features]
default = []
hydrate = ["leptos/hydrate"]
ssr = ["leptos/ssr", "leptos_meta/ssr", "leptos_router/ssr", "dep:leptos_axum", "dep:db", "dep:dotenvy", "dep:media", "dep:axum", "dep:tokio", "dep:uuid", "dep:reqwest", "dep:rand", "dep:hex", "dep:sha2"]


[dev-dependencies]
sqlx.workspace = true
tokio = { workspace = true }
axum.workspace = true
uuid.workspace = true
