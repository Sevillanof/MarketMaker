[workspace]
resolver = "2"
members = [
    "crates/domain",
    "crates/grid",
    "crates/ui",
    "crates/widgets",
    "crates/editor",
    "crates/storefront",
    "crates/db",
    "crates/media",
    "crates/web",
    "crates/wasm",
    "crates/server",
]

# need to be applied only to wasm build
[profile.release]
codegen-units = 1
lto = true
opt-level = 'z'

[workspace.dependencies]
leptos = { version = "0.8" }
leptos_meta = { version = "0.8" }
leptos_router = { version = "0.8" }
leptos_axum = { version = "0.8" }

axum = "0.8"
cfg-if = "1.0.0"
console_error_panic_hook = "0.1.7"
console_log = "1.0.0"
http = "1.3.1"
log = "0.4.27"
simple_logger = "5.0.0"
thiserror = "2.0.12"
tokio = { version = "1.45.0", features = ["full"] }
tower = { version = "0.5.2", features = ["full"] }
tower-http = { version = "0.6.4", features = ["full"] }
wasm-bindgen = "0.2.106"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["BeforeUnloadEvent", "Clipboard", "Navigator", "DataTransfer", "DragEvent", "CssStyleDeclaration", "Document", "DomRect", "DomTokenList", "File", "FileList", "FocusEvent", "FocusOptions", "FormData", "Element", "HtmlInputElement", "Request", "RequestCredentials", "RequestInit", "Response", "HtmlDetailsElement", "HtmlDialogElement", "HtmlElement", "HtmlTextAreaElement", "KeyboardEvent", "Node", "NodeList", "PointerEvent", "ScrollBehavior", "ScrollIntoViewOptions", "ScrollLogicalPosition", "Storage", "UrlSearchParams", "ResizeObserver", "Window"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dotenvy = "0.15"
uuid = { version = "1", features = ["v4", "serde"] }
sha2 = "0.10"
chacha20poly1305 = "0.10"
rand = "0.9"
hex = "0.4"
argon2 = "0.5"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "postgres", "macros", "migrate", "json", "uuid"] }

# See https://github.com/leptos-rs/cargo-leptos for documentation of all the parameters.

# A leptos project defines which workspace members
# that are used together frontend (lib) & server (bin)
[[workspace.metadata.leptos]]
# this name is used for the wasm, js and css file names
name = "marketplace"

# Archivos de /pkg con la versión en el nombre (hash.txt junto al servidor):
# el servidor los manda con cache-control immutable.
hash-files = true

# the package in the workspace that contains the server binary (binary crate)
bin-package = "server"

# the package in the workspace that contains the frontend wasm binary (library crate)
lib-package = "wasm"

# The site root folder is where cargo-leptos generate all output. WARNING: all content of this folder will be erased on a rebuild. Use it in your server setup.
site-root = "target/site"

# The site-root relative folder where all compiled output (JS, WASM and CSS) is written
# Defaults to pkg
site-pkg-dir = "pkg"

# Assets source dir. All files found here will be copied and synchronized to site-root.
# The assets-dir cannot have a sub directory with the same name/path as site-pkg-dir.
#
# Optional. Env: LEPTOS_ASSETS_DIR.
# Tailwind 4 + daisyUI 5 (plugin en style/daisyui.mjs)
tailwind-input-file = "style/tailwind.css"

assets-dir = "public"

# The IP and port (ex: 127.0.0.1:3000) where the server serves the content. Use it in your server setup.
site-addr = "127.0.0.1:3000"

# The port to use for automatic reload monitoring
reload-port = 3001

#  The browserlist query used for optimizing the CSS.
browserquery = "defaults"

# Set by cargo-leptos watch when building with that tool. Controls whether autoreload JS will be included in the head
watch = false

# The environment Leptos will run in, usually either "DEV" or "PROD"
env = "DEV"

# The features to use when compiling the bin target
#
# Optional. Can be over-ridden with the command line parameter --bin-features
bin-features = []

# If the --no-default-features flag should be used when compiling the bin target
#
# Optional. Defaults to false.
bin-default-features = false

# The features to use when compiling the lib target
#
# Optional. Can be over-ridden with the command line parameter --lib-features
lib-features = []

# If the --no-default-features flag should be used when compiling the lib target
#
# Optional. Defaults to false.
lib-default-features = false

# Convertir fotos a AVIF con las dependencias sin optimizar tarda casi un
# minuto; optimizadas, unos segundos, también con `cargo leptos watch`.
# Solo afecta a las dependencias: nuestro código compila igual de rápido.
[profile.dev.package."*"]
opt-level = 3
# El código genérico de rav1e se compila dentro de `media`: también va optimizado.
[profile.dev.package.media]
opt-level = 3
