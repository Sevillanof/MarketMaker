# Revisa una vez por semana si alguna librería de la que depende MarketMaker
# tiene una falla de seguridad conocida (base de RustSec). No frena las
# versiones: si encuentra algo, esta revisión queda en rojo y GitHub avisa.
name: Revisar dependencias

on:
  schedule:
    - cron: "17 9 * * 1"
  push:
    branches: [main]
    paths: [Cargo.lock, .github/workflows/dependencias.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: cargo-audit
        uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2
        with:
          tool: cargo-audit

      - name: Buscar fallas conocidas
        run: cargo audit
